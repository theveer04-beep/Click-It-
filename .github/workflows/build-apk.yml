name: Build CLICK IT A2Z APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract A2Z project
        run: |
          unzip -o CLICK_IT_V1_A2Z_BUILD.zip -d a2z
          PROJECT_DIR=$(dirname "$(find a2z -name settings.gradle -type f | head -1)")
          echo "Project found at: $PROJECT_DIR"
          cp -r "$PROJECT_DIR"/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CLICK-IT-A2Z-APK
          path: app/build/outputs/apk/debug/app-debug.apk
